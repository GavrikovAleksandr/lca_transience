# ethylene
# Intermediate Product|ethylene|FT_distillation_LT_default
# Intermediate Product|ethylene|MTO_with_loop
# Intermediate Product|ethylene|naphtha_steam_cracker_default_default
# Intermediate Product|ethylene|retrofit_MTA_with_loop
# Intermediate Product|ethylene|retrofit_gasoil_cracker
# Intermediate Product|ethylene|retrofit_naphtha_cracker

production pathways:
  # Ethylene pathways
  ethylene_ft_distillation_lt_default:
    # ITOM mode 1. Natural-gas FT light-gas proxy approved as provisional.
    # No FT inputs/utilities in ITOM; see docs/por_ft_lt_inventory.md.
    production volume:
      variable: Intermediate Product|ethylene|FT_distillation_LT_default
    ecoinvent alias:
      name: ethylene production, LT FT distillation, mode 1, natural gas proxy (por)
      reference product: ethylene
      exists in original database: False

  ethylene_mto_with_loop:
    # ITOM mode 2, aligned with propylene; storage service is embedded without a CO2 credit.
    production volume:
      variable: Intermediate Product|ethylene|MTO_with_loop
    ecoinvent alias:
      name: ethylene production, MTO with loop, mode 2, allocated (por)
      reference product: ethylene
      exists in original database: False

  ethylene_naphtha_steam_cracker_default_default:
  # hydrocarbons production, steam cracking operation 
    production volume:
      variable: Intermediate Product|ethylene|naphtha_steam_cracker_default_default
    ecoinvent alias:
      name: unsaturated hydrocarbons production, steam cracking operation, average
      reference product: ethylene
      exists in original database: True

  ethylene_retrofit_mta_with_loop:
  # propylene production, from methanol-to-propylene conversion
    production volume:
     variable: Intermediate Product|ethylene|retrofit_MTA_with_loop
    ecoinvent alias:
      name: light olefins production, from methanol-to-olefins conversion, ethylene-to-propylene ratio of 1.51, retrofit
      reference product: ethylene
      exists in original database: False

  ethylene_retrofit_gasoil_cracker:
    production volume:
      variable: Intermediate Product|ethylene|retrofit_gasoil_cracker
    ecoinvent alias:
      name: unsaturated hydrocarbons production, steam cracking operation, average, retrofit
      reference product: ethylene
      exists in original database: False

  ethylene_retrofit_naphtha_cracker:
    production volume:
      variable: Intermediate Product|ethylene|retrofit_naphtha_cracker
    ecoinvent alias:
      name: unsaturated hydrocarbons production, steam cracking operation, average, retrofit 2
      reference product: ethylene
      exists in original database: False
  
