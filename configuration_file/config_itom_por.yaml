markets:
  - name: market for ethylene (por)
    reference product: ethylene
    unit: kilogram
    includes:
      - ethylene_ft_distillation_lt_default
      - ethylene_mto_with_loop
      - ethylene_naphtha_steam_cracker_default_default
      - ethylene_retrofit_mta_with_loop
      - ethylene_retrofit_gasoil_cracker
      - ethylene_retrofit_naphtha_cracker

    replaces:
      - name: market for ethylene
        product: ethylene
        location: RER

      - name: market for ethylene
        product: ethylene
        location: NL

      - name: market for ethylene
        product: ethylene
        location: RoW

      - name: market for ethylene
        product: ethylene
        location: EUR

      - name: market for ethylene
        product: ethylene
        location: RER w/o RU

    replaces in:
      - location: NL

  - name: market for propylene (por)
    reference product: propylene
    unit: kilogram
    includes:
      - propylene_fcc_propylene_dedicated_default
      - propylene_ft_distillation_lt_default
      - propylene_mto_with_loop
      - propylene_trade_import
      - propylene_naphtha_steam_cracker_default_default
      - propylene_retrofit_mta_with_loop_mode1
      - propylene_retrofit_mta_with_loop_mode2
      - propylene_retrofit_gasoil_cracker
      - propylene_retrofit_naphtha_cracker_mode1
      - propylene_retrofit_naphtha_cracker_mode2

    replaces:
      - name: market for propylene
        product: propylene
        location: RER

      - name: market for propylene
        product: propylene
        location: RoW

      - name: market for propylene
        product: propylene
        location: NL

      - name: market for propylene
        product: propylene
        location: EUR

      - name: market for propylene
        product: propylene
        location: RER w/o RU

    replaces in:
      - location: NL

  # ==========================================================
  # BENZENE UPGRADING
  # ==========================================================
  # The new raw-aromatic LCIs stop before extraction; this market adds
  # purification energy once. Their ecoinvent reference products are
  # equivalents used for market compatibility, not purified-material claims.

  - name: benzene production, from raw benzene upgrading (por)
    reference product: benzene
    unit: kilogram

    includes:
      - raw_benzene_atmospheric_crude_oil_distillation_default
      - raw_benzene_naphtha_steam_cracker_default_default
      - raw_benzene_retrofit_mta_with_loop_mode1
      - raw_benzene_retrofit_mta_with_loop_mode2
      - raw_benzene_retrofit_naphtha_cracker_mode1
      - raw_benzene_retrofit_naphtha_cracker_mode2
      - raw_benzene_trade_import_eu

    add:
      # 0.1 MJ electricity/kg = 0.0277778 kWh/kg.
      - name: market for electricity, medium voltage
        reference product: electricity, medium voltage
        amount: 0.027777778

      # ITOM steam input: 2 TJ/kt = 2 MJ/kg.
      - name: steam production, as energy carrier, in chemical industry, for por
        reference product: heat, from steam, in chemical industry
        amount: 2.0

  # ==========================================================
  # PURIFIED BENZENE MARKET
  # ==========================================================

  - name: market for benzene (por)
    reference product: benzene
    unit: kilogram

    includes:
      - benzene_from_raw_upgrading
      - benzene_trade_import_eu
      - benzene_terminal_import_row
      - benzene_hda

    replaces:
      - name: market for benzene
        product: benzene
        location: RER

      - name: market for benzene
        product: benzene
        location: NL

      - name: market for benzene
        product: benzene
        location: RoW

      - name: market for benzene
        product: benzene
        location: EUR

      - name: market for benzene
        product: benzene
        location: RER w/o RU

    replaces in:
      - location: NL

  # ==========================================================
  # TOLUENE UPGRADING
  # ==========================================================

  - name: toluene production, from raw toluene upgrading (por)
    reference product: toluene, liquid
    unit: kilogram

    includes:
      - raw_toluene_atmospheric_crude_oil_distillation_default
      - raw_toluene_naphtha_steam_cracker_default_default
      - raw_toluene_retrofit_mta_with_loop_mode1
      - raw_toluene_retrofit_mta_with_loop_mode2
      - raw_toluene_retrofit_naphtha_cracker_mode1
      - raw_toluene_trade_import_eu

    add:
      # 0.1 MJ electricity/kg = 0.0277778 kWh/kg.
      - name: market for electricity, medium voltage
        reference product: electricity, medium voltage
        amount: 0.027777778

      # ITOM steam input: 2 TJ/kt = 2 MJ/kg.
      - name: steam production, as energy carrier, in chemical industry, for por
        reference product: heat, from steam, in chemical industry
        amount: 2.0

      # ITOM also produces 0.04361687 kg hydrogen/kg toluene.
      # No hydrogen credit is added here because the allocation or
      # substitution treatment has not yet been confirmed.

  # ==========================================================
  # PURIFIED TOLUENE MARKET
  # ==========================================================

  - name: market for toluene (por)
    reference product: toluene, liquid
    unit: kilogram

    includes:
      # No Trade|To PoR|toluene or active toluene_terminal_BAT
      # variable exists in the current CL/OCE scenario data.
      - toluene_from_raw_upgrading

    replaces:
      - name: market for toluene, liquid
        product: toluene, liquid
        location: RER

      - name: market for toluene, liquid
        product: toluene, liquid
        location: NL

      - name: market for toluene, liquid
        product: toluene, liquid
        location: RoW

      - name: market for toluene, liquid
        product: toluene, liquid
        location: EUR

      - name: market for toluene, liquid
        product: toluene, liquid
        location: RER w/o RU

    replaces in:
      - location: NL

  # ==========================================================
  # RAW PARA-XYLENE UPGRADING
  # ==========================================================
  #
  # Although this is constructed through the premise "markets"
  # section, it acts as a conversion activity:
  #
  #   1 kg raw p-xylene
  #   + electricity
  #   + HT heat
  #   -> 1 kg purified p-xylene
  #
  # The raw suppliers are normalized to one kg of input.

  - name: p-xylene production, from raw p-xylene upgrading (por)
    reference product: p-xylene
    unit: kilogram

    includes:
      - raw_para_xylene_atmospheric_crude_oil_distillation_default
      - raw_para_xylene_naphtha_steam_cracker_default_default
      - raw_para_xylene_retrofit_mta_with_loop_mode1
      - raw_para_xylene_retrofit_mta_with_loop_mode2
      - raw_para_xylene_retrofit_naphtha_cracker_mode1
      #imports
      - raw_para_xylene_trade_import_eu

    add:
      # ITOM: 0.2 TJ electricity per kt p-xylene
      #       = 0.2 MJ/kg
      #       = 0.0555556 kWh/kg
      - name: market for electricity, medium voltage
        reference product: electricity, medium voltage
        amount: 0.055555556

      # ITOM: 0.8 TJ HT heat per kt p-xylene
      #       = 0.8 MJ/kg
      #
      # This activity must exist or be replaced by a documented
      # high-temperature-heat proxy.
      - name: market group for heat, district or industrial, natural gas
        reference product: heat, district or industrial, natural gas
        amount: 0.8

  # ==========================================================
  # PURIFIED PARA-XYLENE MARKET
  # ==========================================================

  - name: market for p-xylene (por)
    reference product: p-xylene
    unit: kilogram

    includes:
      # Purified output obtained from raw-material upgrading.
      # The share is driven by:
      # Original extraction minus the terminal-origin local-used share.
      - para_xylene_from_raw_upgrading

      # Terminal imports are already purified, per the ITOM clarification.
      # Use local supply after proportional export allocation, not gross imports.
      - para_xylene_terminal_import_row

      # Already-purified European import.
      - para_xylene_trade_import_eu

    replaces:
      - name: market for p-xylene
        product: p-xylene
        location: RER

      - name: market for p-xylene
        product: p-xylene
        location: NL

      - name: market for p-xylene
        product: p-xylene
        location: RoW

      - name: market for p-xylene
        product: p-xylene
        location: EUR

      - name: market for p-xylene
        product: p-xylene
        location: RER w/o RU

    replaces in:
      - location: NL

  - name: market for methanol (por)
    reference product: methanol
    unit: kilogram

    includes:
      - methanol_dac_terminal_row
      - methanol_methane_gsr
      - methanol_from_syngas
      - methanol_trade_import_eu

    replaces:
      - name: market for methanol
        product: methanol

      - name: market for methanol (SPS)
        product: methanol

    replaces in:
      - location: NL
