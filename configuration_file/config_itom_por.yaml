      exists in original database: False

  propylene_retrofit_mta_with_loop_mode1:
    production volume:
      variable: Intermediate Product|propylene|retrofit_MTA_with_loop|mode1
    ecoinvent alias:
      name: propylene production, MTA retrofit, mode 1, allocated (por)
      reference product: propylene
      exists in original database: False

  propylene_retrofit_mta_with_loop_mode2:
    production volume:
      variable: Intermediate Product|propylene|retrofit_MTA_with_loop|mode2
    ecoinvent alias:
      name: propylene production, MTA retrofit, mode 2, allocated (por)
      reference product: propylene
      exists in original database: False

  propylene_retrofit_gasoil_cracker:
    production volume:
      variable: Intermediate Product|propylene|retrofit_gasoil_cracker
    ecoinvent alias:
      name: propylene production, gasoil cracker retrofit, waste oil proxy, allocated (por)
      reference product: propylene
      exists in original database: False

  propylene_retrofit_naphtha_cracker_mode1:
    production volume:
      variable: Intermediate Product|propylene|retrofit_naphtha_cracker|mode1
    ecoinvent alias:
      name: propylene production, naphtha cracker retrofit, fossil mode, allocated (por)
