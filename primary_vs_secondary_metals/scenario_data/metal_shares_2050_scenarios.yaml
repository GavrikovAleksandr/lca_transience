    named files are authoritative.
  generator_version: 1
  source: yaml
  source_sha256:
    metal_primary_secondary_shares.yaml: 73f8c17baf1f8962bb3d056e7a8163c8eca7397a41a8fc2f47acd7090f484d29
    metal_2050_literature_evidence.csv: 8c0305bf83f4684241bfa24478513797b4a51ace43a255b265ca28761d370877
    metal_product_family_mapping.csv: 2e6b81879bc4619ee53abfcdb6878452adcdd2050e9bafaa5392af3d734c6030
