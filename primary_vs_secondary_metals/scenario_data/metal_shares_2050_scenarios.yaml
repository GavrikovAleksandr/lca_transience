evidence:
  aluminium:
    conservative: 0.45
    baseline: 0.6
    optimistic: 0.7
    basis_type: direct/inferred
    confidence: medium
    source_short: JRC aluminium decarbonisation + China stock-flow
    source_url: https://publications.jrc.ec.europa.eu/repository/bitstream/JRC136525/JRC136525_01.pdf
      | https://www.researchgate.net/publication/384001661_Modeling_Aluminum_Stocks_and_Flows_in_China_until_2050_Using_a_Bottom-Up_Approach_Business-As-Usual_Scenario_Analysis
    notes: JRC reports BAU post-consumer scrap recycling rising to 60 Mt by 2050 and
      >70 Mt with maximised collection; Chinese stock-flow study says secondary aluminium
      could meet ~70% of demand by 2050 under high recycling.
  copper:
    conservative: 0.25
    baseline: 0.35
    optimistic: 0.45
    basis_type: direct/inferred
    confidence: medium
    source_short: ICA Europe + IEA recycling outlook
    source_url: https://internationalcopper.org/wp-content/uploads/2023/03/Copper_The-Pathway-to-Net-Zero_Focus-on-Europe_final.pdf
      | https://www.iea.org/reports/global-critical-minerals-outlook-2025/overview-of-outlook-for-key-minerals
    notes: EU refined copper in 2050 expected to include 0.9-1.0 Mt EoL scrap out
      of 3.4 Mt total (~26-29%); IEA says recycling can reduce new mine development
      by ~35-40% for copper by 2050.
  cobalt:
    conservative: 0.2
    baseline: 0.3
    optimistic: 0.4
    basis_type: direct/inferred
    confidence: medium
    source_short: IEA recycling of critical minerals
    source_url: https://www.iea.org/reports/recycling-of-critical-minerals/executive-summary
      | https://www.iea.org/reports/global-critical-minerals-outlook-2025/overview-of-outlook-for-key-minerals
    notes: IEA says battery recycling could meet 20-30% of lithium/nickel/cobalt demand
      by 2050; copper and cobalt mining needs can be reduced ~35-40% by 2050 with
      increased recycling.
  nickel:
    conservative: 0.2
    baseline: 0.25
    optimistic: 0.3
    basis_type: direct
    confidence: medium
    source_short: IEA recycling of critical minerals
    source_url: https://www.iea.org/reports/recycling-of-critical-minerals/executive-summary
      | https://www.iea.org/reports/global-critical-minerals-outlook-2025/overview-of-outlook-for-key-minerals
    notes: IEA says battery recycling could meet 20-30% of lithium/nickel/cobalt demand
      by 2050; recycling reduces new mine development needs by ~15-25% for nickel
      by 2050.
  lithium:
    conservative: 0.2
    baseline: 0.25
    optimistic: 0.3
    basis_type: direct
    confidence: medium
    source_short: IEA recycling of critical minerals
    source_url: https://www.iea.org/reports/recycling-of-critical-minerals/executive-summary
      | https://www.iea.org/reports/global-critical-minerals-outlook-2025/overview-of-outlook-for-key-minerals
    notes: IEA says battery recycling could meet 20-30% of lithium demand by 2050
      depending on collection rates; mine development needs decline >20% to ~25% with
      higher recycling.
  graphite:
    conservative: 0.1
    baseline: 0.15
    optimistic: 0.2
    basis_type: inferred
    confidence: low
    source_short: IEA graphite secondary supply charts
    source_url: https://www.iea.org/data-and-statistics/charts/secondary-supply-volumes-and-share-of-total-demand-for-graphite-in-the-announced-pledges-scenario-and-net-zero-emissions-by-2050-scenario-2023-2050
    notes: IEA publishes explicit graphite secondary-supply-to-demand charts to 2050;
      scenario values here are conservative placeholders pending chart extraction.
  lead:
    conservative: 0.65
    baseline: 0.77
    optimistic: 0.85
    basis_type: direct/inferred
    confidence: medium
    source_short: Van der Voet et al. 2019
    source_url: https://bdsv.de/de/resources/Voet_et_al-2018-Journal_of_Industrial_Ecology.pdf
    notes: Paper reports 2050 secondary production shares spanning 13% for zinc to
      77% for lead across the seven major metals assessed.
  zinc:
    conservative: 0.1
    baseline: 0.13
    optimistic: 0.2
    basis_type: direct/inferred
    confidence: medium
    source_short: Van der Voet et al. 2019
    source_url: https://bdsv.de/de/resources/Voet_et_al-2018-Journal_of_Industrial_Ecology.pdf
    notes: Paper reports 2050 secondary production shares spanning 13% for zinc to
      77% for lead across the seven major metals assessed.
  rare_earths:
    conservative: 0.02
    baseline: 0.05
    optimistic: 0.1
    basis_type: inferred
    confidence: low
    source_short: EIT rare earth report + IEA rare earth charts
    source_url: https://www.eit.europa.eu/sites/default/files/2021_09-24_ree_cluster_report2.pdf
      | https://www.iea.org/reports/recycling-of-critical-minerals/executive-summary
    notes: EU report says less than 1% of rare earths are recycled today; 2050 values
      here assume progress but still structurally low recycling.
  precious_metals:
    conservative: 0.1
    baseline: 0.2
    optimistic: 0.3
    basis_type: inferred
    confidence: low
    source_short: IEA end-of-life recycling chart
    source_url: https://www.iea.org/data-and-statistics/charts/end-of-life-recycling-rates-for-selected-metals
    notes: IEA chart shows high EoL recycling rates for gold, silver, platinum and
      palladium; supply-share values here are set below EoL rates to reflect collection,
      fabrication and market constraints.
  pgm:
    conservative: 0.15
    baseline: 0.25
    optimistic: 0.35
    basis_type: inferred
    confidence: low
    source_short: IEA end-of-life recycling chart + EU PGM recycling paper
    source_url: https://www.iea.org/data-and-statistics/charts/end-of-life-recycling-rates-for-selected-metals
      | https://open-research-europe.ec.europa.eu/articles/2-92/v1/pdf?article_uuid=775641aa-cc2f-4c7b-910f-efded28fa17d
    notes: PGMs have relatively high end-of-life recyclability and growing recovery
      opportunities from fuel cells/electrolysers; values remain below EoL rates.
  base_low:
    conservative: 0.05
    baseline: 0.1
    optimistic: 0.15
    basis_type: heuristic
    confidence: low
    source_short: OECD + IEA generic recycling trend
    source_url: https://www.oecd.org/content/dam/oecd/en/publications/support-materials/2019/02/global-material-resources-outlook-to-2060_g1g98d7d/highlights-global-material-resources-outlook-to-2060.pdf
      | https://www.iea.org/reports/the-role-of-critical-minerals-in-clean-energy-transitions/the-state-of-play
    notes: Fallback for refined metals lacking a metal-specific 2050 study in the
      current evidence pack. OECD expects recycling to become more competitive, but
      both primary and secondary use still rise.
  nonmetal_low:
    conservative: 0.0
    baseline: 0.0
    optimistic: 0.0
    basis_type: structural
    confidence: high
    source_short: No meaningful secondary market defined
    source_url: ''
    notes: Used for ores, concentrates, explicit primary products, and non-metal mineral
      feedstocks where a secondary share is not meaningful in this market definition.
